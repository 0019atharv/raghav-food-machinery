<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="raghavBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#225419"/>
      <stop offset="0.5" stop-color="#3D9B28"/>
      <stop offset="1" stop-color="#1b4213"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield/Circle -->
  <rect width="128" height="128" rx="28" fill="url(#raghavBg)"/>

  <!-- Outer Industrial Gear Ring -->
  <circle cx="64" cy="64" r="50" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="16 8" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="44" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Center Machinery Cog & Monogram RF -->
  <g filter="url(#shadow)">
    <!-- Central Cog Core -->
    <circle cx="64" cy="64" r="32" fill="#ffffff"/>
    
    <!-- Bold RAGHAV 'R' Letterform in Green -->
    <path d="M52 46 H66 C72 46 76 49.5 76 54.5 C76 58.5 73.5 61.5 69.5 62.5 L77 78 H70 L63.5 63.5 H58.5 V78 H52 V46 Z M58.5 58.5 H65 C68 58.5 70 57 70 54.5 C70 52 68 50.5 65 50.5 H58.5 V58.5 Z" fill="#3D9B28"/>
    
    <!-- Food Processing Leaf Accent in Gold -->
    <path d="M69 44 C75 42 80 46 80 50 C76 51 71 48 69 44 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
